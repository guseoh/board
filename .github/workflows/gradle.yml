name: Board CI/CD

on:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

  deploy:
    name: Deploy to EC2
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script_stop: true
          script: |
            set -e

            echo "[1] Move to project directory"
            cd ~/apps/board

            echo "[2] Ensure log directory exists"
            mkdir -p ~/apps/board/logs

            echo "[3] Pull latest source"
            git pull origin master

            echo "[4] Grant execute permission for gradlew"
            chmod +x ./gradlew

            echo "[5] Build project"
            ./gradlew clean build -x test

            echo "[6] Find current running app PID"
            CURRENT_PID=$(pgrep -f 'board-0.0.1-SNAPSHOT.jar' || true)

            if [ -n "$CURRENT_PID" ]; then
              echo "Current PID: $CURRENT_PID"
              echo "[7] Stop current application"
              kill -15 $CURRENT_PID
              sleep 5
            else
              echo "No running application found"
            fi

            echo "[8] Find new jar"
            JAR_PATH=$(find ~/apps/board/build/libs -maxdepth 1 -name "*.jar" ! -name "*plain.jar" | head -n 1)

            if [ -z "$JAR_PATH" ]; then
              echo "JAR file not found"
              exit 1
            fi

            echo "JAR_PATH=$JAR_PATH"

            echo "[9] Start new application"
            nohup java -jar "$JAR_PATH" > ~/apps/board/logs/app.log 2>&1 &

            sleep 5

            echo "[10] Check application process"
            NEW_PID=$(pgrep -f "$JAR_PATH" || true)

            if [ -z "$NEW_PID" ]; then
              echo "Application failed to start"
              tail -n 50 ~/apps/board/logs/app.log
              exit 1
            fi

            echo "Application started successfully. PID=$NEW_PID"
