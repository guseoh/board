name: Board CI/CD

on:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

  deploy:
    name: Deploy to EC2
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script_stop: true
          script: |
            set -e

            APP_DIR=~/apps/board
            LOG_DIR=$APP_DIR/logs
            PID_FILE=$APP_DIR/app.pid

            echo "[1] Move to project directory"
            cd $APP_DIR

            echo "[2] Ensure log directory exists"
            mkdir -p $LOG_DIR

            echo "[3] Pull latest source"
            git pull origin master

            echo "[4] Grant execute permission for gradlew"
            chmod +x ./gradlew

            echo "[5] Build project"
            ./gradlew clean build -x test

            echo "[6] Stop current application"

            if [ -f "$PID_FILE" ]; then
              OLD_PID=$(cat "$PID_FILE")

              if ps -p "$OLD_PID" > /dev/null 2>&1; then
                echo "Current PID: $OLD_PID"
                kill -15 "$OLD_PID"
                sleep 5
              else
                echo "PID file exists, but process is not running"
              fi

              rm -f "$PID_FILE"
            else
              echo "No PID file found"
            fi

            echo "[7] Find new jar"
            JAR_PATH=$(find $APP_DIR/build/libs -maxdepth 1 -name "*.jar" ! -name "*plain.jar" | head -n 1)

            if [ -z "$JAR_PATH" ]; then
              echo "JAR file not found"
              exit 1
            fi

            echo "JAR_PATH=$JAR_PATH"

            echo "[8] Start new application"
            nohup java -jar "$JAR_PATH" > $LOG_DIR/app.log 2>&1 &

            NEW_PID=$!
            echo "$NEW_PID" > "$PID_FILE"

            sleep 5

            echo "[9] Check application process"

            if ! ps -p "$NEW_PID" > /dev/null 2>&1; then
              echo "Application failed to start"
              tail -n 50 $LOG_DIR/app.log
              exit 1
            fi

            echo "Application started successfully. PID=$NEW_PID"
