services:
  mysql:
    image: mysql:8.0
    container_name: board-mysql-dev
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - board-mysql-dev-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  board-mysql-dev-data: