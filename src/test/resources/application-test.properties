spring.application.name=board-test
spring.config.import=optional:classpath:application-oauth.properties

spring.datasource.url=jdbc:h2:mem:board-test;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

discord.webhook.enabled=false
discord.webhook.url=

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
