<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>로그인</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5" style="max-width: 420px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3 class="mb-4 text-center">Login</h3>

            <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>

            <form th:action="@{/login}" method="post">
                <div th:if="${param.error}" class="alert alert-danger">
                    로그인에 실패했습니다. 이메일/비밀번호를 확인해주세요.
                </div>
                <div th:if="${param.logout}" class="alert alert-info">
                    로그아웃 되었습니다.
                </div>

                <div class="mb-3">
                    <label class="form-label">이메일</label>
                    <input class="form-control" type="text" name="username" placeholder="email" autocomplete="username"
                           required/>
                </div>

                <div class="mb-3">
                    <label class="form-label">비밀번호</label>
                    <input class="form-control" type="password" name="password" placeholder="password"
                           autocomplete="current-password" required/>
                </div>

                <button class="btn btn-primary w-100" type="submit">로그인</button>

                <div class="d-flex justify-content-between mt-3">
                    <a class="text-decoration-none" th:href="@{/signup}">회원가입</a>
                    <a class="text-decoration-none" th:href="@{/}">홈으로</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
