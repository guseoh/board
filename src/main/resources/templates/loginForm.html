<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 페이지</title>
</head>
<body>
<h1>Login</h1>

<form action="/login" method="post">
    <div>
        <input name="email" placeholder="email" />
    </div>
    <div>
        <input type="password" name="password" placeholder="password" />
    </div>
    <button type="submit">로그인</button>
</form>

<a href="/signup">회원가입을 아직 하지 않으셨나요?</a>
</body>
</html>
