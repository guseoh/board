<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('게시판')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar('post')}"></div>

<div class="page-wrap">
    <div class="container py-4">

        <div th:if="${msg}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${msg}">완료</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}">오류</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>


        <div class="d-flex justify-content-end align-items-center mb-3">
            <a class="btn btn-signup" th:href="@{/post/new}">
                <i class="bi bi-pencil-square"></i> 작성하기
            </a>
        </div>

        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th style="width: 90px;">번호</th>
                        <th>제목</th>
                        <th style="width: 140px;">조회</th>
                        <th style="width: 180px;">작성일</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:if="${#lists.isEmpty(posts)}">
                        <td colspan="4" class="text-center text-muted py-5">아직 작성된 글이 없습니다.</td>
                    </tr>

                    <tr th:each="post : ${posts}">
                        <td class="text-muted" th:text="${post.id}">1</td>
                        <td>
                            <a class="text-decoration-none fw-semibold"
                               th:href="@{/post/{id}(id=${post.id})}"
                               th:text="${post.title}">제목</a>
                        </td>
                        <td>
              <span class="badge text-bg-secondary"
                    th:text="${post.viewCount != null ? post.viewCount : 0}">0</span>
                        </td>
                        <td class="text-muted"
                            th:text="${post.createdAt != null ? #temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">
                            2026-01-30
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
