<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('게시판')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar('post')}"></div>

<div class="page-wrap">
    <div class="container py-4">

        <div th:if="${msg}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${msg}">완료</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}">오류</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>


        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0">게시판</h3>
            <a class="btn btn-primary" th:href="@{/post/new}">
                <i class="bi bi-pencil-square"></i> 글쓰기
            </a>
        </div>

        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th style="width: 90px;">번호</th>
                        <th>제목</th>
                        <th style="width: 140px;">조회</th>
                        <th style="width: 180px;">작성일</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:if="${#lists.isEmpty(posts)}">
                        <td colspan="4" class="text-center text-muted py-5">아직 작성된 글이 없습니다.</td>
                    </tr>

                    <tr th:each="post : ${posts}">
                        <td class="text-muted" th:text="${post.id}">1</td>
                        <td>
                            <a class="text-decoration-none fw-semibold"
                               th:href="@{/post/{id}(id=${post.id})}"
                               th:text="${post.title}">제목</a>
                        </td>
                        <td>
              <span class="badge text-bg-secondary"
                    th:text="${post.viewCount != null ? post.viewCount : 0}">0</span>
                        </td>
                        <td class="text-muted"
                            th:text="${post.createdAt != null ? #temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">
                            2026-01-30
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

<!--        <nav class="mt-3" th:if="${page != null and page.totalPages > 1}"-->
<!--             th:with="start=${T(java.lang.Math).max(0, page.number-2)},-->
<!--                  end=${T(java.lang.Math).min(page.totalPages-1, page.number+2)}">-->
<!--            <ul class="pagination justify-content-center">-->

<!--                <li class="page-item" th:classappend="${page.first} ? 'disabled' : ''">-->
<!--                    <a class="page-link" th:href="@{/post(page=${page.number-1})}">이전</a>-->
<!--                </li>-->

<!--                <li class="page-item"-->
<!--                    th:each="i : ${#numbers.sequence(start, end)}"-->
<!--                    th:classappend="${i == page.number} ? 'active' : ''">-->
<!--                    <a class="page-link" th:href="@{/post(page=${i})}" th:text="${i+1}">1</a>-->
<!--                </li>-->

<!--                <li class="page-item" th:classappend="${page.last} ? 'disabled' : ''">-->
<!--                    <a class="page-link" th:href="@{/post(page=${page.number+1})}">다음</a>-->
<!--                </li>-->

<!--            </ul>-->
<!--        </nav>-->

    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
