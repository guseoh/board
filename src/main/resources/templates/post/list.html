<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('게시판')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar('post')}"></div>

<div class="page-wrap">
    <div class="container py-4">

        <div th:if="${msg}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${msg}">완료</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}">오류</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>


        <div class="d-flex justify-content-end align-items-center mb-3">

            <form th:action="@{/posts/search}" method="get" class="d-flex" style="max-width: 320px;">
                <input type="text"
                       name="keyword"
                       class="form-control me-2"
                       placeholder="제목 검색"
                       th:value="${keyword}">
                <button class="btn btn-outline-secondary" type="submit">
                    <i class="bi bi-search"></i>
                </button>
            </form>

            <a class="btn btn-signup" th:href="@{/post/new}">
                <i class="bi bi-pencil-square"></i> 작성하기
            </a>
        </div>

        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th style="width: 90px;">번호</th>
                        <th>제목</th>
                        <th style="width: 140px;">작성자</th>
                        <th style="width: 140px;">조회</th>
                        <th style="width: 180px;">작성일</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:if="${#lists.isEmpty(posts)}">
                        <td colspan="5" class="text-center text-muted py-5">아직 작성된 글이 없습니다.</td>
                    </tr>

                    <tr th:each="post : ${posts}">
                        <td class="text-muted" th:text="${post.id}">1</td>
                        <td>
                            <a class="text-decoration-none fw-semibold"
                               th:href="@{/post/{id}(id=${post.id})}"
                               th:text="${post.title}">제목</a>
                        </td>
                        <td>
                            <span class="badge text-bg-secondary"
                                  th:text="${post.memberNickname}">작성자</span>
                        </td>
                        <td>
                            <span class="badge text-bg-secondary"
                                  th:text="${post.viewCount != null ? post.viewCount : 0}">0</span>
                        </td>
                        <td class="text-muted"
                            th:text="${post.createdAt != null ? #temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">
                            2026-01-30
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <nav class="mt-4" th:if="${page != null and !#lists.isEmpty(page.pageList)}" aria-label="게시글 페이지 이동">
            <ul class="pagination justify-content-center mb-0">

                <li class="page-item" th:classappend="${page.prev} ? '' : ' disabled'">
                    <a class="page-link"
                       th:if="${page.prev}"
                       th:href="@{/(page=${page.pageList[0]-1}, size=${page.size})}">
                        이전
                    </a>
                    <span class="page-link" th:unless="${page.prev}">이전</span>
                </li>

                <li class="page-item"
                    th:each="p : ${page.pageList}"
                    th:classappend="${p == page.page} ? ' active'">
                    <a class="page-link"
                       th:href="@{/(page=${p}, size=${page.size})}"
                       th:text="${p}">1</a>
                </li>

                <li class="page-item" th:classappend="${page.next} ? '' : ' disabled'">
                    <a class="page-link"
                       th:if="${page.next}"
                       th:href="@{/(page=${page.pageList[page.pageList.size()-1]+1}, size=${page.size})}">
                        다음
                    </a>
                    <span class="page-link" th:unless="${page.next}">다음</span>
                </li>

            </ul>
        </nav>

    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
