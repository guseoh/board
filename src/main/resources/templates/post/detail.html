<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${post != null ? post.title : '게시글'})}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar('post')}"></div>

<div class="page-wrap">
    <div class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h3 class="mb-1" th:text="${post.title}">제목</h3>
                <div class="text-muted small">
                    <span th:text="${post.createdAt != null ? #temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">-</span>
                    <span class="mx-2">•</span>
                    조회 <span th:text="${post.viewCount != null ? post.viewCount : 0}">0</span>
                </div>
            </div>

            <div class="d-flex gap-2">
                <a class="btn btn-outline-secondary" th:href="@{/}">목록</a>
                <a class="btn btn-outline-primary" th:href="@{/post/{id}/edit(id=${post.id})}">수정</a>

                <form th:action="@{/post/{id}/delete(id=${post.id})}" method="post"
                      onsubmit="return confirm('정말 삭제할까요?');">
                    <button class="btn btn-outline-danger" type="submit">삭제</button>
                </form>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <pre class="content mb-0" th:text="${post.content}">내용</pre>
            </div>
        </div>

        <!-- 댓글 섹션 -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0">
                        댓글 <span class="text-muted" th:text="${comments != null ? comments.size() : 0}">0</span>
                    </h5>
                </div>

                <!-- 댓글 작성 폼 -->
                <div class="mb-4">
                    <!-- 비로그인 시 안내 (스프링 시큐리티 사용 시) -->
                    <div class="alert alert-secondary py-2 mb-3"
                         th:if="${#authentication == null || #authentication.name == 'anonymousUser'}">
                        댓글을 작성하려면 로그인이 필요합니다.
                        <a th:href="@{/loginForm}" class="ms-2">로그인</a>
                    </div>

                    <!-- 로그인 시 폼 노출 -->
                    <form th:if="${#authentication != null && #authentication.name != 'anonymousUser'}"
                          th:action="@{/post/{postId}/comment(postId=${post.id})}"
                          th:object="${commentForm}"
                          method="post">

                        <div class="mb-2">
                            <textarea class="form-control" rows="3"
                                      th:field="*{content}"
                                      placeholder="댓글을 입력하세요 (최대 500자)"></textarea>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('content')}"
                                 th:errors="*{content}">내용 오류</div>
                        </div>

                        <div class="d-flex justify-content-end">
                            <button class="btn btn-primary" type="submit">댓글 등록</button>
                        </div>
                    </form>
                </div>

                <!-- 댓글 목록 -->
                <div th:if="${comments == null || comments.isEmpty()}" class="text-muted">
                    아직 댓글이 없습니다.
                </div>

                <div th:if="${comments != null && !comments.isEmpty()}">
                    <div class="border-top pt-3" th:each="c : ${comments}">
                        <div class="d-flex justify-content-between align-items-start gap-3">
                            <div class="flex-grow-1">
                                <div class="d-flex align-items-center gap-2 mb-1">
                                    <strong th:text="${c.member != null ? c.member.nickname : '알 수 없음'}">작성자</strong>
                                    <span class="text-muted small"
                                          th:text="${c.createdAt != null ? #temporals.format(c.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">-</span>
                                </div>
                                <div th:text="${c.content}">댓글 내용</div>
                            </div>

                            <div class="d-flex gap-2"
                                 th:if="${memberId != null && c.member != null && c.member.id == memberId}">

                                <form th:action="@{/post/{postId}/comment/{commentId}/update(postId=${post.id}, commentId=${c.id})}"
                                      method="post"
                                      onsubmit="return (function(f){var v=prompt('수정할 댓글 내용을 입력하세요', ''); if(v===null) return false; f.content.value=v; return true;})(this);">
                                    <input type="hidden" name="content" value=""/>
                                    <button class="btn btn-outline-primary btn-sm" type="submit">수정</button>
                                </form>

                                <form th:action="@{/post/{postId}/comment/{commentId}/delete(postId=${post.id}, commentId=${c.id})}"
                                      method="post"
                                      onsubmit="return confirm('댓글을 삭제할까요?');">
                                    <button class="btn btn-outline-danger btn-sm" type="submit">삭제</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
