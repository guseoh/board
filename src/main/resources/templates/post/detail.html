<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${post != null ? post.title : '게시글'})}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar('post')}"></div>

<div class="page-wrap">
    <div class="container py-4 detail-container">

        <div class="card shadow-sm okky-post-header mb-3">
            <div class="card-body d-flex justify-content-between align-items-start gap-3 post-detail-header">
                <div class="flex-grow-1">
                    <h3 class="post-title" th:text="${post.title}">제목</h3>

                    <div class="post-meta">
                        <span th:text="${post.createdAt != null ? #temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">
                            -
                        </span>
                        <span class="meta-dot">•</span>
                        조회 <span th:text="${post.viewCount != null ? post.viewCount : 0}">0</span>
                    </div>
                </div>

                <div class="post-detail-actions d-flex gap-2 flex-wrap justify-content-end">
                    <a class="btn btn-sm btn-post-list" th:href="@{/}">
                        목록
                    </a>

                    <th:block th:if="${memberId != null && post.member.id == memberId}">
                        <a class="btn btn-sm btn-post-submit"
                           th:href="@{/post/{id}/edit(id=${post.id})}">
                            수정
                        </a>

                        <form th:action="@{/post/{id}/delete(id=${post.id})}"
                              method="post"
                              onsubmit="return confirm('정말 삭제할까요?');">
                            <button class="btn btn-sm btn-post-delete" type="submit">
                                삭제
                            </button>
                        </form>
                    </th:block>
                </div>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body post-body">
                <pre class="content post-content mb-0" th:text="${post.content}">내용</pre>
            </div>
        </div>

        <div class="card shadow-sm mb-4 attachment-section">
            <div class="card-body">
                <div class="d-flex flex-column flex-md-row justify-content-between gap-2 mb-3">
                    <div>
                        <h5 class="mb-1 attachment-title">첨부파일</h5>
                        <p class="attachment-help mb-0">
                            이미지 썸네일, 파일명, 다운로드 버튼이 표시될 영역입니다.
                        </p>
                    </div>
                    <span class="attachment-count">0개</span>
                </div>

                <ul class="attachment-preview-list list-unstyled mb-0 d-none" aria-label="첨부파일 목록"></ul>

                <div class="attachment-empty-state">
                    <div class="attachment-thumbnail-placeholder">
                        <i class="bi bi-paperclip"></i>
                    </div>
                    <div>
                        <div class="attachment-empty-title">첨부된 파일이 없습니다.</div>
                        <div class="attachment-empty-desc">
                            추후 파일 업로드 기능이 연결되면 이 영역에 첨부파일 목록이 표시됩니다.
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0 comment-title">
                        댓글
                        <span class="text-muted"
                              th:text="${comments != null ? comments.size() : 0}">
                            0
                        </span>
                    </h5>
                </div>

                <div class="mb-4">
                    <div class="comment-login-box d-flex justify-content-between align-items-center gap-3"
                         th:if="${#authentication == null || #authentication.name == 'anonymousUser'}">
                        <div>
                            댓글을 쓰려면 <a th:href="@{/loginForm}">로그인</a>이 필요합니다.
                        </div>

                        <a th:href="@{/loginForm}" class="btn btn-post-action btn-post-submit btn-sm">
                            댓글 쓰기
                        </a>
                    </div>

                    <form th:if="${#authentication != null && #authentication.name != 'anonymousUser'}"
                          th:action="@{/post/{postId}/comment(postId=${post.id})}"
                          th:object="${commentForm}"
                          method="post"
                          class="comment-form d-flex gap-3 align-items-start">

                        <div class="comment-avatar">
                            <span th:text="${loginNickname != null ? #strings.substring(loginNickname,0,1) : '나'}">
                                나
                            </span>
                        </div>

                        <div class="flex-grow-1">
                            <textarea class="form-control comment-textarea"
                                      rows="3"
                                      th:field="*{content}"
                                      placeholder="댓글을 입력하세요 (최대 500자)"></textarea>

                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('content')}"
                                 th:errors="*{content}">
                                내용 오류
                            </div>

                            <div class="d-flex justify-content-end mt-2">
                                <button class="btn btn-post-action btn-post-submit" type="submit">
                                    댓글 등록
                                </button>
                            </div>
                        </div>
                    </form>
                </div>

                <div th:if="${comments == null || comments.isEmpty()}" class="text-muted">
                    아직 댓글이 없습니다.
                </div>

                <div th:if="${comments != null && !comments.isEmpty()}">
                    <div class="comment-divider pt-3 pb-3 comment-item"
                         th:each="c : ${comments}">

                        <div class="d-flex justify-content-between align-items-start gap-3">

                            <div class="d-flex gap-3 flex-grow-1">
                                <div class="comment-avatar">
                                    <span th:text="${c.nickname != null ? #strings.substring(c.nickname,0,1) : '?'}">
                                        ?
                                    </span>
                                </div>

                                <div class="flex-grow-1">
                                    <div class="d-flex align-items-center gap-2 mb-1">
                                        <strong th:text="${c.nickname != null ? c.nickname : '알 수 없음'}">
                                            작성자
                                        </strong>

                                        <span class="text-muted small"
                                              th:text="${c.createdAt != null ? #temporals.format(c.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">
                                            -
                                        </span>
                                    </div>

                                    <div class="comment-view comment-content"
                                         th:attr="data-comment-id=${c.id}"
                                         th:text="${c.content}">
                                        댓글 내용
                                    </div>

                                    <div class="comment-edit d-none mt-2"
                                         th:attr="data-comment-id=${c.id}">
                                        <form th:action="@{/post/{postId}/comment/{commentId}/edit(postId=${post.id}, commentId=${c.id})}"
                                              method="post"
                                              class="border rounded-3 p-2">

                                            <textarea name="content"
                                                      class="form-control comment-textarea"
                                                      rows="3"
                                                      th:text="${c.content}"></textarea>

                                            <div class="d-flex justify-content-end gap-2 mt-2">
                                                <button type="button"
                                                        class="btn btn-sm btn-post-cancel"
                                                        th:attr="data-cancel-id=${c.id}"
                                                        onclick="cancelEdit(this)">
                                                    취소
                                                </button>

                                                <button type="submit" class="btn btn-sm btn-post-submit">
                                                    저장
                                                </button>
                                            </div>
                                        </form>
                                    </div>

                                    <div class="mt-2"
                                         th:if="${#authentication != null && #authentication.name != 'anonymousUser'}">
                                        <form th:action="@{/post/{postId}/comment/{parentId}/replies(postId=${post.id}, parentId=${c.id})}"
                                              method="post"
                                              class="comment-reply-form d-flex gap-2 align-items-start mt-2">

                                            <textarea name="content"
                                                      class="form-control comment-textarea"
                                                      rows="2"
                                                      placeholder="답글을 입력하세요"></textarea>

                                            <button type="submit"
                                                    class="btn btn-sm btn-post-submit flex-shrink-0">
                                                답글 등록
                                            </button>
                                        </form>
                                    </div>

                                    <div class="mt-2"
                                         th:if="${#authentication == null || #authentication.name == 'anonymousUser'}">
                                        <a class="small text-muted"
                                           th:href="@{/loginForm}">
                                            답글을 쓰려면 로그인이 필요합니다.
                                        </a>
                                    </div>

                                    <div class="comment-replies mt-3"
                                         th:if="${c.replies != null && !c.replies.isEmpty()}">
                                        <div class="border-start ps-3 py-2"
                                             th:each="reply : ${c.replies}">

                                            <div class="d-flex justify-content-between align-items-start gap-3">
                                                <div class="flex-grow-1">
                                                    <div class="d-flex align-items-center gap-2 mb-1">
                                                        <strong th:text="${reply.nickname != null ? reply.nickname : '알 수 없음'}">
                                                            작성자
                                                        </strong>

                                                        <span class="text-muted small"
                                                              th:text="${reply.createdAt != null ? #temporals.format(reply.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">
                                                            -
                                                        </span>
                                                    </div>

                                                    <div class="comment-view comment-content"
                                                         th:attr="data-comment-id=${reply.id}"
                                                         th:text="${reply.content}">
                                                        대댓글 내용
                                                    </div>

                                                    <div class="comment-edit d-none mt-2"
                                                         th:attr="data-comment-id=${reply.id}">
                                                        <form th:action="@{/post/{postId}/comment/{commentId}/edit(postId=${post.id}, commentId=${reply.id})}"
                                                              method="post"
                                                              class="border rounded-3 p-2">

                                                            <textarea name="content"
                                                                      class="form-control comment-textarea"
                                                                      rows="3"
                                                                      th:text="${reply.content}"></textarea>

                                                            <div class="d-flex justify-content-end gap-2 mt-2">
                                                                <button type="button"
                                                                        class="btn btn-sm btn-post-cancel"
                                                                        th:attr="data-cancel-id=${reply.id}"
                                                                        onclick="cancelEdit(this)">
                                                                    취소
                                                                </button>

                                                                <button type="submit" class="btn btn-sm btn-post-submit">
                                                                    저장
                                                                </button>
                                                            </div>
                                                        </form>
                                                    </div>
                                                </div>

                                                <div class="d-flex gap-2 flex-shrink-0"
                                                     th:if="${memberId != null && reply.memberId == memberId}">

                                                    <button class="btn btn-sm btn-post-submit"
                                                            type="button"
                                                            th:attr="data-edit-id=${reply.id}"
                                                            onclick="startEdit(this)">
                                                        수정
                                                    </button>

                                                    <form th:action="@{/post/{postId}/comment/{commentId}/delete(postId=${post.id}, commentId=${reply.id})}"
                                                          method="post"
                                                          onsubmit="return confirm('댓글을 삭제할까요?');">
                                                        <button class="btn btn-sm btn-post-delete" type="submit">
                                                            삭제
                                                        </button>
                                                    </form>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex gap-2 flex-shrink-0"
                                 th:if="${memberId != null && c.memberId == memberId}">

                                <button class="btn btn-sm btn-post-submit"
                                        type="button"
                                        th:attr="data-edit-id=${c.id}"
                                        onclick="startEdit(this)">
                                    수정
                                </button>

                                <form th:action="@{/post/{postId}/comment/{commentId}/delete(postId=${post.id}, commentId=${c.id})}"
                                      method="post"
                                      onsubmit="return confirm('댓글을 삭제할까요?');">
                                    <button class="btn btn-sm btn-post-delete" type="submit">
                                        삭제
                                    </button>
                                </form>
                            </div>

                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    function startEdit(btn) {
        const id = btn.getAttribute('data-edit-id');
        const view = document.querySelector('.comment-view[data-comment-id="' + id + '"]');
        const edit = document.querySelector('.comment-edit[data-comment-id="' + id + '"]');

        if (!view || !edit) return;

        view.classList.add('d-none');
        edit.classList.remove('d-none');

        const textarea = edit.querySelector('textarea[name="content"]');
        if (textarea) textarea.focus();
    }

    function cancelEdit(btn) {
        const id = btn.getAttribute('data-cancel-id');
        const view = document.querySelector('.comment-view[data-comment-id="' + id + '"]');
        const edit = document.querySelector('.comment-edit[data-comment-id="' + id + '"]');

        if (!view || !edit) return;

        const original = view.innerText;
        const textarea = edit.querySelector('textarea[name="content"]');

        if (textarea) textarea.value = original;

        edit.classList.add('d-none');
        view.classList.remove('d-none');
    }
</script>

</body>
</html>
