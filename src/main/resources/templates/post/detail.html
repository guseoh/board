<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${post != null ? post.title : '게시글'})}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar('post')}"></div>

<div class="page-wrap">
    <div class="container detail-container py-4">

        <section class="card shadow-sm mb-4 okky-post-header">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-start gap-3 flex-wrap">
                    <div class="flex-grow-1">

                        <h1 class="post-title" th:text="${post.title}">제목</h1>

                        <div class="post-meta d-flex flex-wrap align-items-center gap-2">

                            <span class="fw-semibold" th:text="${post.member.nickname}">작성자</span>
                            <span class="meta-dot">•</span>

                            <span th:text="${post.createdAt != null ? #temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">-</span>
                            <span class="meta-dot">•</span>
                            <span>조회 <span th:text="${post.viewCount != null ? post.viewCount : 0}">0</span></span>
                        </div>
                    </div>

                    <div class="d-flex gap-2 flex-shrink-0">
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/}">목록</a>
                        <a class="btn btn-outline-primary btn-sm" th:href="@{/post/{id}/edit(id=${post.id})}">수정</a>

                        <form th:action="@{/post/{id}/delete(id=${post.id})}" method="post"
                              class="d-inline"
                              onsubmit="return confirm('정말 삭제할까요?');">
                            <button class="btn btn-outline-danger btn-sm" type="submit">삭제</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <section class="card shadow-sm">
            <div class="card-body post-body">
                <pre class="content post-content mb-0" th:text="${post.content}">내용</pre>
            </div>
        </section>
