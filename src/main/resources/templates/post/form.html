<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${mode=='edit' ? '게시글 수정' : '글쓰기'})}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar('post')}"></div>

<div class="page-wrap">
    <div class="container py-4 post-form-page">

        <div class="post-form-header">
            <h1 class="post-form-title"
                th:text="${mode=='edit' ? '게시글 수정' : '글쓰기'}">
                글쓰기
            </h1>

            <a class="btn btn-post-action btn-post-list" th:href="@{/}">
                목록
            </a>
        </div>

        <div class="card shadow-sm post-form-card">
            <div class="card-body">
                <form th:action="${actionUrl}" method="post" th:object="${form}">

                    <div class="mb-4">
                        <label class="form-label">제목</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{title}"
                               placeholder="제목을 입력하세요">

                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('title')}"
                             th:errors="*{title}">
                            제목 에러
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">내용</label>
                        <textarea class="form-control"
                                  rows="12"
                                  th:field="*{content}"
                                  placeholder="내용을 입력하세요"></textarea>

                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('content')}"
                             th:errors="*{content}">
                            내용 에러
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="attachment-upload-box">
                            <div class="d-flex flex-column flex-md-row justify-content-between gap-2 mb-3">
                                <div>
                                    <label class="form-label mb-1" for="postAttachments">첨부파일</label>
                                    <p class="attachment-help mb-0">
                                        이미지 또는 문서 파일을 첨부할 수 있습니다. 현재는 UI만 제공되며, 실제 업로드 처리는 추후 구현 예정입니다.
                                    </p>
                                </div>
                                <span class="attachment-count" id="attachmentCount">선택된 파일 0개</span>
                            </div>

                            <input type="file"
                                   id="postAttachments"
                                   name="_attachmentFiles"
                                   class="form-control"
                                   accept="image/*,.pdf,.txt,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip"
                                   multiple
                                   aria-describedby="attachmentHelp">

                            <div id="attachmentHelp" class="form-text mt-2">
                                업로드 저장, 삭제, 다운로드 기능은 백엔드 구현 후 연결됩니다.
                            </div>

                            <div class="attachment-selected mt-3">
                                <div class="attachment-empty" id="attachmentEmpty">
                                    선택된 파일이 없습니다.
                                </div>
                                <ul class="attachment-file-list list-unstyled mb-0 d-none" id="attachmentFileList"></ul>
                            </div>
                        </div>
                    </div>

                    <div class="post-form-actions">
                        <a class="btn btn-post-action btn-post-cancel" th:href="@{/}">
                            취소
                        </a>

                        <button class="btn btn-post-action btn-post-submit"
                                type="submit"
                                th:text="${submitLabel} ?: (${mode=='edit'} ? '수정' : '등록')">
                            등록
                        </button>
                    </div>

                </form>
            </div>
        </div>

    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const input = document.getElementById('postAttachments');
        const count = document.getElementById('attachmentCount');
        const empty = document.getElementById('attachmentEmpty');
        const list = document.getElementById('attachmentFileList');

        if (!input || !count || !empty || !list) return;

        input.addEventListener('change', function () {
            const files = Array.from(input.files || []);

            count.textContent = '선택된 파일 ' + files.length + '개';
            list.innerHTML = '';

            if (files.length === 0) {
                empty.classList.remove('d-none');
                list.classList.add('d-none');
                return;
            }

            empty.classList.add('d-none');
            list.classList.remove('d-none');

            files.forEach(function (file) {
                const item = document.createElement('li');
                item.className = 'attachment-file-item';

                const name = document.createElement('span');
                name.className = 'attachment-file-name';
                name.textContent = file.name;

                const size = document.createElement('span');
                size.className = 'attachment-file-size';
                size.textContent = formatFileSize(file.size);

                item.appendChild(name);
                item.appendChild(size);
                list.appendChild(item);
            });
        });

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }
    });
</script>
</body>
</html>
