<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${mode=='edit' ? '게시글 수정' : '글쓰기'})}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar('post')}"></div>

<div class="page-wrap">
    <div class="container py-4" style="max-width: 900px;">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0" th:text="${mode=='edit' ? '게시글 수정' : '글쓰기'}">글쓰기</h3>
            <a class="btn btn-outline-secondary" th:href="@{/}">목록</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <form th:action="${actionUrl}" method="post" th:object="${form}">
                    <div class="mb-3">
                        <label class="form-label">제목</label>
                        <input type="text" class="form-control" th:field="*{title}"
                               placeholder="제목을 입력하세요">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">
                            제목 에러
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">내용</label>
                        <textarea class="form-control" rows="12" th:field="*{content}"
                                  placeholder="내용을 입력하세요"></textarea>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('content')}"
                             th:errors="*{content}">
                            내용 에러
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a class="btn btn-outline-secondary" th:href="@{/}">취소</a>
                        <button class="btn btn-primary" type="submit"
                                th:text="${submitLabel} ?: (${mode=='edit'} ? '수정' : '등록')">등록</button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
