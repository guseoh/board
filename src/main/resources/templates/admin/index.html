<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('관리자 대시보드')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar('admin')}"></div>

<div class="page-wrap admin-page">
    <div class="container py-4">

        <div th:if="${msg}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${msg}">완료</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}">오류</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <section class="admin-hero mb-4">
            <div class="card shadow-sm admin-hero-card">
                <div class="card-body p-4 p-md-5">
                    <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3">
                        <div>
                            <div class="admin-badge mb-2">
                                <i class="bi bi-shield-lock me-1"></i> Admin
                            </div>
                            <h1 class="admin-page-title mb-2">관리자 대시보드</h1>
                            <p class="admin-page-desc mb-0">
                                게시글, 회원, 운영 현황을 한눈에 확인하고 관리할 수 있습니다.
                            </p>
                        </div>

                        <div class="d-flex flex-wrap gap-2">
                            <a class="btn btn-outline-light" th:href="@{/}">
                                <i class="bi bi-house-door me-1"></i> 메인으로
                            </a>
                            <a class="btn btn-primary" th:href="@{/admin/posts}">
                                <i class="bi bi-file-earmark-text me-1"></i> 게시물 관리
                            </a>
                            <a class="btn btn-primary" th:href="@{/admin/users}">
                                <i class="bi bi-people me-1"></i> 사용자 관리
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="mb-4">
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="card admin-stat-card shadow-sm h-100">
                        <div class="card-body">
                            <div class="admin-stat-label">전체 게시글 수</div>
                            <div class="admin-stat-value" th:text="${totalPosts}">0</div>
                            <div class="admin-stat-subtext">현재 등록된 게시글 수</div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card admin-stat-card shadow-sm h-100">
                        <div class="card-body">
                            <div class="admin-stat-label">전체 사용자 수</div>
                            <div class="admin-stat-value" th:text="${totalUsers}">0</div>
                            <div class="admin-stat-subtext">가입된 전체 회원 수</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section>
            <div class="card shadow-sm admin-section-card">
                <div class="card-body p-4">
                    <div class="mb-3">
                        <h2 class="admin-section-title mb-1">관리 메뉴</h2>
                        <p class="admin-section-subtitle mb-0">필요한 관리 화면으로 바로 이동할 수 있습니다.</p>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <a th:href="@{/admin/posts}" class="admin-quick-link text-decoration-none d-block">
                                <div class="admin-quick-icon">
                                    <i class="bi bi-file-earmark-text"></i>
                                </div>
                                <div>
                                    <div class="admin-quick-title">게시물 관리</div>
                                    <div class="admin-quick-desc">게시글 조회 및 삭제 관리</div>
                                </div>
                            </a>
                        </div>

                        <div class="col-md-6">
                            <a th:href="@{/admin/users}" class="admin-quick-link text-decoration-none d-block">
                                <div class="admin-quick-icon">
                                    <i class="bi bi-people"></i>
                                </div>
                                <div>
                                    <div class="admin-quick-title">사용자 관리</div>
                                    <div class="admin-quick-desc">회원 권한 변경 및 삭제 관리</div>
                                </div>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
