<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>관리자 대시보드</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/admin">Admin Dashboard</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="row g-4">
        <div class="col-md-6">
            <div class="card p-4">
                <h2>Total Posts</h2>
                <span class="badge bg-secondary" th:text="${totalPosts}">0</span>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card p-4">
                <h2>Total Users</h2>
                <span class="badge bg-secondary" th:text="${totalUsers}">0</span>
            </div>
        </div>
    </div>
    <div class="mt-4">
        <a class="btn btn-primary" href="/admin/posts">게시물 관리</a>
        <a class="btn btn-primary" href="/admin/users">사용자 관리</a>
    </div>
</div>
</body>
</html>
