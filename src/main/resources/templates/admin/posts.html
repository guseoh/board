<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('게시물 관리')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar('admin')}"></div>

<div class="page-wrap admin-page">
    <div class="container py-4">

        <div th:if="${msg}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${msg}">완료</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}">오류</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- 상단 헤더 -->
        <section class="mb-4">
            <div class="card shadow-sm admin-hero-card">
                <div class="card-body p-4 p-md-5">
                    <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3">
                        <div>
                            <div class="admin-badge mb-2">
                                <i class="bi bi-file-earmark-text me-1"></i> Admin Posts
                            </div>
                            <h1 class="admin-page-title mb-2">게시물 관리</h1>
                            <p class="admin-page-desc mb-0">
                                전체 게시글을 조회하고, 필요 시 삭제할 수 있습니다.
                            </p>
                        </div>

                        <div class="d-flex flex-wrap gap-2">
                            <a class="btn btn-outline-light" th:href="@{/admin}">
                                <i class="bi bi-arrow-left me-1"></i> 대시보드
                            </a>
                            <a class="btn btn-outline-light" th:href="@{/}">
                                <i class="bi bi-house-door me-1"></i> 메인으로
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 게시물 테이블 -->
        <section>
            <div class="card shadow-sm admin-section-card">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div>
                            <h2 class="admin-section-title mb-1">게시글 목록</h2>
                            <p class="admin-section-subtitle mb-0">삭제 전에는 항상 한 번 더 확인하는 것을 권장합니다.</p>
                        </div>
                    </div>

                    <div th:if="${#lists.isEmpty(posts)}" class="admin-empty-box">
                        현재 등록된 게시글이 없습니다.
                    </div>

                    <div th:unless="${#lists.isEmpty(posts)}" class="table-responsive">
                        <table class="table admin-table align-middle mb-0">
                            <thead>
                            <tr>
                                <th style="width: 90px;">ID</th>
                                <th>제목</th>
                                <th style="width: 140px;">작성자</th>
                                <th style="width: 180px;">작성일</th>
                                <th style="width: 120px;" class="text-center">관리</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="post : ${posts}">
                                <td class="text-muted" th:text="${post.id}">1</td>
                                <td>
                                    <div class="admin-table-title" th:text="${post.title}">제목</div>
                                </td>
                                <td>
                                    <span class="badge text-bg-secondary"
                                          th:text="${post.member.nickname}">작성자</span>
                                </td>
                                <td class="text-muted"
                                    th:text="${#temporals.format(post.createdAt,'yyyy-MM-dd HH:mm')}">
                                    2026-03-31
                                </td>
                                <td class="text-center">
                                    <form th:action="@{/admin/posts/{id}/delete(id=${post.id})}"
                                          method="post"
                                          onsubmit="return confirm('정말로 이 게시글을 삭제하시겠습니까?');">
                                        <button class="btn btn-outline-danger btn-sm admin-action-btn" type="submit">
                                            삭제
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>
        </section>

    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
