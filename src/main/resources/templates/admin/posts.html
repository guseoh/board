<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>게시물 관리</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/admin">관리자 페이지</a>
    </div>
</nav>

<div class="container mt-4">
    <h2>게시물 관리</h2>
    <table class="table table-hover mt-3">
        <thead>
        <tr>
            <th>ID</th>
            <th>제목</th>
            <th>작성자</th>
            <th>작성일</th>
            <th>제거</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="post : ${posts}">
            <td th:text="${post.id}">1</td>
            <td th:text="${post.title}">제목</td>
            <td th:text="${post.member.getNickname()}">작성자</td>
            <td th:text="${#temporals.format(post.createdAt,'yyyy-MM-dd HH:mm')}">2026-03-31</td>
            <td>
                <form th:action="@{/admin/posts/{id}/delete(id=${post.id})}" method="post">
                    <button class="btn btn-outline-danger btn-sm" type="submit">삭제</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
