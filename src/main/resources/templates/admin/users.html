<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('사용자 관리')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar('admin')}"></div>

<div class="page-wrap admin-page">
    <div class="container py-4">

        <div th:if="${msg}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${msg}">완료</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}">오류</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <section class="mb-4">
            <div class="card shadow-sm admin-hero-card">
                <div class="card-body p-4 p-md-5">
                    <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3">
                        <div>
                            <div class="admin-badge mb-2">
                                <i class="bi bi-people me-1"></i> Admin Users
                            </div>
                            <h1 class="admin-page-title mb-2">사용자 관리</h1>
                            <p class="admin-page-desc mb-0">
                                회원 권한을 변경하고, 필요 시 계정을 삭제할 수 있습니다.
                            </p>
                        </div>

                        <div class="d-flex flex-wrap gap-2">
                            <a class="btn btn-outline-light" th:href="@{/admin}">
                                <i class="bi bi-arrow-left me-1"></i> 대시보드
                            </a>
                            <a class="btn btn-outline-light" th:href="@{/}">
                                <i class="bi bi-house-door me-1"></i> 메인으로
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section>
            <div class="card shadow-sm admin-section-card">
                <div class="card-body p-4">
                    <div class="mb-3">
                        <h2 class="admin-section-title mb-1">회원 목록</h2>
                        <p class="admin-section-subtitle mb-0">권한 변경과 사용자 삭제는 신중하게 진행하세요.</p>
                    </div>

                    <div th:if="${#lists.isEmpty(members)}" class="admin-empty-box">
                        현재 등록된 사용자가 없습니다.
                    </div>

                    <div th:unless="${#lists.isEmpty(members)}" class="table-responsive">
                        <table class="table admin-table align-middle mb-0">
                            <thead>
                            <tr>
                                <th style="width: 80px;">ID</th>
                                <th style="width: 140px;">닉네임</th>
                                <th>이메일</th>
                                <th style="width: 120px;">권한</th>
                                <th style="width: 260px;" class="text-center">관리</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="member : ${members}">
                                <td class="text-muted" th:text="${member.id}">1</td>
                                <td>
                                    <span class="admin-user-name" th:text="${member.nickname}">nickname</span>
                                </td>
                                <td class="text-muted" th:text="${member.email}">email@example.com</td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${member.role.name() == 'ADMIN'} ? ' text-bg-primary' : ' text-bg-secondary'"
                                          th:text="${member.role}">USER</span>
                                </td>
                                <td>
                                    <div class="d-flex flex-column flex-lg-row gap-2 justify-content-center">

                                        <form th:action="@{/admin/users/{id}/role(id=${member.id})}"
                                              method="post"
                                              class="d-flex gap-2 admin-role-form">
                                            <select name="role" class="form-select form-select-sm">
                                                <option th:selected="${member.role.name()=='USER'}" value="USER">USER</option>
                                                <option th:selected="${member.role.name()=='ADMIN'}" value="ADMIN">ADMIN</option>
                                            </select>
                                            <button class="btn btn-outline-primary btn-sm admin-action-btn"
                                                    type="submit">
                                                변경
                                            </button>
                                        </form>

                                        <form th:action="@{/admin/users/{id}/delete(id=${member.id})}"
                                              method="post"
                                              onsubmit="return confirm('정말로 이 사용자를 삭제하시겠습니까?');">
                                            <button class="btn btn-outline-danger btn-sm admin-action-btn"
                                                    type="submit">
                                                삭제
                                            </button>
                                        </form>

                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>
        </section>

    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
