<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>사용자 관리</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/admin">관리자 페이지</a>
    </div>
</nav>

<div class="container mt-4">
    <h2>사용자 관리</h2>
    <table class="table table-hover mt-3">
        <thead>
        <tr>
            <th>ID</th>
            <th>닉네임</th>
            <th>이메일</th>
            <th>권한</th>
            <th>액션</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="member : ${members}">
            <td th:text="${member.id}">1</td>
            <td th:text="${member.nickname}">nickname</td>
            <td th:text="${member.email}">email@example.com</td>
            <td th:text="${member.role}">USER</td>
            <td>
                <div class="d-flex gap-2">
                    <form th:action="@{/admin/users/{id}/role(id=${member.id})}" method="post" class="d-flex gap-1">
                        <select name="role" class="form-select form-select-sm">
                            <option th:selected="${member.role.name()=='USER'}" value="USER">USER</option>
                            <option th:selected="${member.role.name()=='ADMIN'}" value="ADMIN">ADMIN</option>
                        </select>
                        <button class="btn btn-outline-primary btn-sm" type="submit">변경</button>
                    </form>

                    <form th:action="@{/admin/users/{id}/delete(id=${member.id})}" method="post">
                        <button class="btn btn-outline-danger btn-sm" type="submit"
                                onclick="return confirm('정말로 이 사용자를 삭제하시겠습니까?');">
                            삭제
                        </button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
