<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body th:fragment="navbar(activeMenu)">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">Board</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link"
                       th:classappend="${activeMenu}=='post' ? 'active' : ''"
                       th:href="@{/post}">게시판</a>
                </li>
            </ul>

            <div class="d-flex gap-2">
                <a class="btn btn-outline-light btn-sm" th:href="@{/loginForm}">로그인</a>
                <a class="btn btn-warning btn-sm" th:href="@{/member/signup}">회원가입</a>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
