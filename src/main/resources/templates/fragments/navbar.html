<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body th:fragment="navbar(activeMenu)">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">Board</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link"
                       th:classappend="${activeMenu == 'post'} ? ' active' : ''"
                       th:href="@{/}">
                        <i class="bi bi-house-door me-1"></i> 게시판
                    </a>
                </li>

                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link"
                       th:classappend="${activeMenu == 'my' or activeMenu == 'my-posts' or activeMenu == 'my-comments'} ? ' active' : ''"
                       th:href="@{/my}">
                        <i class="bi bi-person-circle me-1"></i> 마이페이지
                    </a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link"
                       th:classappend="${activeMenu == 'admin'} ? ' active' : ''"
                       th:href="@{/admin}">
                        <i class="bi bi-shield-lock me-1"></i> 관리자
                    </a>
                </li>
            </ul>

            <div class="navbar-actions d-flex gap-2 ms-auto">
                <div sec:authorize="isAnonymous()" class="d-flex gap-2">
                    <a class="btn btn-login btn-sm" th:href="@{/loginForm}">로그인</a>
                    <a class="btn btn-signup btn-sm" th:href="@{/signup}">회원가입</a>
                </div>

                <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                    <span class="text-light small">
                        <span th:text="${#authentication.principal.nickname}"></span>님
                    </span>

                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button class="btn btn-login btn-sm" type="submit">로그아웃</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
